[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
asyncio_mode = auto
markers =
    unit: 단위 테스트 (외부 의존 없음)
    integration: 통합 테스트 (파이프라인 전체 실행)
    api: API 서버 통합 테스트
    accuracy: 정확도 벤치마크 (실제 모델 필요, 느림)
    slow: 실행 시간이 긴 테스트
